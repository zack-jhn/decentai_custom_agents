schema_version: "1.0"

agent:
  id: github
  name: GitHub Agent
  version: "1.1.0"
  description: >
    Lists pull requests, reads their diffs and creates issues in GitHub
    repositories. Pairs with the Jira agent to link engineering work back
    to tasks.
  tags:
    - github
    - engineering
    - code
  instructions: >
    Use the GitHub tools to work with repositories, issues and pull
    requests. Repositories are named as owner and repo. Read a pull
    request's diff before summarizing or reviewing it, and say so when
    the diff was truncated. Confirm the repository and title before
    creating an issue.

implementation:
  entrypoint: agent:GitHubAgent
  dependencies:
    - "httpx>=0.24,<1"

resources:
  secrets:
    - id: github_token
      label: GitHub Access Token
      description: >
        A personal access token (classic or fine-grained) with access to
        the repositories. Leave the API base URL empty for github.com;
        set it for GitHub Enterprise (https://ghe.example.com/api/v3).
      binding: {cardinality: one, required: true}
      fields:
        - {name: token, label: Access Token, type: secret, storage: values, required: true}
        - {name: api_base_url, label: API Base URL, type: string, storage: keys, required: false}

tools:
  - id: github
    name: GitHub Tool
    description: Reads pull requests and creates issues.
    resources:
      secrets: [github_token]
    functions:

      - id: list_prs
        name: List Pull Requests
        description: List a repository's pull requests, most recently updated first.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {github_token: use}
        authorization:
          action: github.list_prs
        inputs:
          type: object
          additionalProperties: false
          required: [owner, repo]
          properties:
            owner: {type: string, minLength: 1}
            repo: {type: string, minLength: 1}
            state: {type: string, enum: [open, closed, all], default: open}
            limit: {type: integer, minimum: 1, maximum: 100, default: 30}
        outputs:
          type: object
          required: [prs]
          properties:
            prs:
              type: array
              items:
                type: object
                required: [number, title, state, author]
                properties:
                  number: {type: integer}
                  title: {type: string}
                  state: {type: string}
                  author: {type: string}
                  draft: {type: boolean}
                  url: {type: string}

      - id: get_pr_diff
        name: Get PR Diff
        description: >
          The diff of a pull request, for summarizing or reviewing. Long
          diffs are cut at 20,000 characters and flagged as truncated.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {github_token: use}
        authorization:
          action: github.get_pr_diff
        inputs:
          type: object
          additionalProperties: false
          required: [owner, repo, pr_number]
          properties:
            owner: {type: string, minLength: 1}
            repo: {type: string, minLength: 1}
            pr_number: {type: integer, minimum: 1}
        outputs:
          type: object
          required: [diff_content, truncated]
          properties:
            diff_content: {type: string}
            truncated: {type: boolean}

      - id: create_issue
        name: Create GitHub Issue
        description: Create an issue in a repository.
        permission_level: 1
        timeout_seconds: 30
        resources:
          secrets: {github_token: use}
        authorization:
          action: github.create_issue
        inputs:
          type: object
          additionalProperties: false
          required: [owner, repo, title]
          properties:
            owner: {type: string, minLength: 1}
            repo: {type: string, minLength: 1}
            title: {type: string, minLength: 1}
            body: {type: string}
            labels:
              type: array
              items: {type: string}
        outputs:
          type: object
          required: [number, issue_url]
          properties:
            number: {type: integer}
            issue_url: {type: string}
